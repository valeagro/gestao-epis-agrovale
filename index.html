<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EPIs Agrovale</title>
    
    <!-- Configurações PWA e iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EPIs Agrovale">
    
    <!-- Novo Ícone (Escudo, Capacete e Controlo) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%231F2937' d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z'/><path fill='%234CAF50' d='M12 3l7.5 3.3v5.2c0 4.2-2.6 8-7.5 9.3-4.9-1.3-7.5-5.1-7.5-9.3V6.3L12 3m0-2L2 5v6c0 5.5 3.8 10.7 10 12 6.2-1.3 10-6.5 10-12V5L12 1z'/><path fill='%23F59E0B' d='M12 7c-2.8 0-5 2.2-5 5v1h10v-1c0-2.8-2.2-5-5-5zm-5 7h10v1H7v-1z'/><path fill='%2310B981' d='M10 17l-3-3 1.4-1.4 1.6 1.6 4.6-4.6L16 11l-6 6z'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%231F2937' d='M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z'/><path fill='%234CAF50' d='M12 3l7.5 3.3v5.2c0 4.2-2.6 8-7.5 9.3-4.9-1.3-7.5-5.1-7.5-9.3V6.3L12 3m0-2L2 5v6c0 5.5 3.8 10.7 10 12 6.2-1.3 10-6.5 10-12V5L12 1z'/><path fill='%23F59E0B' d='M12 7c-2.8 0-5 2.2-5 5v1h10v-1c0-2.8-2.2-5-5-5zm-5 7h10v1H7v-1z'/><path fill='%2310B981' d='M10 17l-3-3 1.4-1.4 1.6 1.6 4.6-4.6L16 11l-6 6z'/></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            var(--primary): #4CAF50; --primary-light: rgba(76, 175, 80, 0.15); --primary-hover: #45a049;
            --text-main: #e5e7eb; --text-muted: #9ca3af; --bg-body: #111827; --bg-card: #1f2937; 
            --border: #374151; --danger: #ef4444; --danger-hover: #dc2626; --warning-bg: #422006; 
            --warning-text: #fde68a; --input-bg: #374151; --whatsapp: #25D366; --whatsapp-hover: #1da851;
            --pdf: #e11d48; --pdf-hover: #be123c;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
        
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-body); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .splash-icon svg { width: 100px; height: 100px; margin-bottom: 25px; }
        #splash-screen h1 { color: #ffffff; font-size: 24px; font-weight: 700; margin-bottom: 30px; letter-spacing: 0.5px; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: #4CAF50; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .app-container {
            background-color: var(--bg-card); width: 100%; max-width: 700px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            overflow: hidden; display: flex; flex-direction: column; height: 100%; max-height: 96vh;
        }

        .header { background-color: #4CAF50; color: #ffffff; padding: 20px 20px 0 20px; text-align: center; position: relative; }
        .header h1 { font-size: 20px; margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .header-icon svg { width: 28px; height: 28px; }
        
        #btnInstalarApp {
            display: none; position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.2); 
            border: 1px solid rgba(255,255,255,0.4); color: white; padding: 6px 12px; border-radius: 20px; 
            font-size: 12px; cursor: pointer; font-weight: 600;
        }

        .tabs { display: flex; gap: 5px; }
        .tab-btn { flex: 1; background: rgba(0,0,0,0.2); border: none; color: #ffffff; padding: 12px 5px; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 8px 8px 0 0; transition: 0.3s; opacity: 0.7; }
        .tab-btn.active { background: var(--bg-card); color: #ffffff; opacity: 1; font-weight: 600; }

        .content-area { padding: 20px; overflow-y: auto; flex-grow: 1; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 18px; }
        .row-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .row-group > * { flex: 1; min-width: 140px; }

        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: var(--text-main); }
        input[type="text"], input[type="number"], select { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; background-color: var(--input-bg); color: var(--text-main); }
        input:focus, select:focus { outline: none; border-color: #4CAF50; box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2); }
        input[readonly] { background-color: #1f2937; color: var(--text-muted); opacity: 0.7; font-weight: 500; }

        .epi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; max-height: 35vh; overflow-y: auto; padding-right: 5px; }
        .epi-card { display: flex; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--bg-card); font-size: 13px; }
        .epi-card input[type="checkbox"] { display: none; }
        .checkbox-custom { width: 20px; height: 20px; border: 2px solid var(--text-muted); border-radius: 6px; margin-right: 12px; display: flex; align-items: center; justify-content: center; background-color: var(--input-bg); flex-shrink: 0; }
        .epi-card input[type="checkbox"]:checked + .checkbox-custom { background-color: #4CAF50; border-color: #4CAF50; }
        .epi-card input[type="checkbox"]:checked + .checkbox-custom::after { content: "✓"; color: #ffffff; font-size: 14px; font-weight: bold; }
        .epi-card:has(input:checked) { background-color: var(--primary-light); border-color: #4CAF50; color: #4CAF50; font-weight: 600; }

        .warning-box { display: none; background-color: var(--warning-bg); color: var(--warning-text); padding: 14px; border-radius: 10px; font-size: 13px; margin-bottom: 18px; border-left: 4px solid #f59e0b; line-height: 1.5; }
        
        .add-epi-container { display: flex; gap: 8px; }
        .add-epi-container input { flex: 1; }
        .add-epi-container button { width: auto; margin-bottom: 0; padding: 0 15px; white-space: nowrap; font-size: 13px;}

        .btn { width: 100%; padding: 14px; color: #ffffff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; }
        .btn-primary { background-color: #4CAF50; }
        .btn-danger { background-color: var(--danger); }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: #4CAF50; }
        .btn-pdf { background-color: var(--pdf); }
        .btn-wpp { background-color: var(--whatsapp); }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-group > * { flex: 1; min-width: 130px; }

        .table-responsive { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; max-height: 40vh;}
        .history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .history-table th { background-color: #111827; color: var(--text-muted); text-align: left; padding: 10px; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0;}
        .history-table td { padding: 10px; border-bottom: 1px solid var(--border); color: var(--text-main); }
        .empty-state { text-align: center; padding: 20px; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- TELA INICIAL (SPLASH) -->
    <div id="splash-screen">
        <div class="splash-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path fill="#1F2937" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
                <path fill="#4CAF50" d="M12 3l7.5 3.3v5.2c0 4.2-2.6 8-7.5 9.3-4.9-1.3-7.5-5.1-7.5-9.3V6.3L12 3m0-2L2 5v6c0 5.5 3.8 10.7 10 12 6.2-1.3 10-6.5 10-12V5L12 1z"/>
                <path fill="#F59E0B" d="M12 7c-2.8 0-5 2.2-5 5v1h10v-1c0-2.8-2.2-5-5-5zm-5 7h10v1H7v-1z"/>
                <path fill="#10B981" d="M10 17l-3-3 1.4-1.4 1.6 1.6 4.6-4.6L16 11l-6 6z"/>
            </svg>
        </div>
        <h1>Controlo de EPIs</h1>
        <div class="spinner"></div>
    </div>

    <!-- APLICAÇÃO -->
    <div class="app-container">
        <header class="header">
            <button id="btnInstalarApp">Instalar App</button>
            <h1>
                <div class="header-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path fill="#1F2937" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
                        <path fill="#4CAF50" d="M12 3l7.5 3.3v5.2c0 4.2-2.6 8-7.5 9.3-4.9-1.3-7.5-5.1-7.5-9.3V6.3L12 3m0-2L2 5v6c0 5.5 3.8 10.7 10 12 6.2-1.3 10-6.5 10-12V5L12 1z"/>
                        <path fill="#F59E0B" d="M12 7c-2.8 0-5 2.2-5 5v1h10v-1c0-2.8-2.2-5-5-5zm-5 7h10v1H7v-1z"/>
                        <path fill="#10B981" d="M10 17l-3-3 1.4-1.4 1.6 1.6 4.6-4.6L16 11l-6 6z"/>
                    </svg>
                </div>
                Gestão Agrovale
            </h1>
            <div class="tabs">
                <button class="tab-btn active" onclick="openTab('tab-entrega', this)">Nova Entrega</button>
                <button class="tab-btn" onclick="openTab('tab-historico', this)">Histórico</button>
                <button class="tab-btn" onclick="openTab('tab-colab', this)">Equipa</button>
            </div>
        </header>

        <div class="content-area">
            
            <!-- ABA 1: NOVA ENTREGA -->
            <section id="tab-entrega" class="tab-content active">
                <form id="epiForm">
                    <div class="form-group row-group">
                        <div>
                            <label for="lider">Líder</label>
                            <select id="lider" required>
                                <option value="">Selecione...</option>
                                <option value="68592">Marcos A. (T: 8)</option>
                                <option value="66680">Lázaro E. (T: 9)</option>
                                <option value="68999">Diogo B. (T: 89)</option>
                            </select>
                        </div>
                        <div>
                            <label for="matricula">Matrícula</label>
                            <input type="number" id="matricula" placeholder="Ex: 93482" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <input type="text" id="nome" placeholder="Nome do Colaborador" readonly>
                    </div>

                    <div class="form-group">
                        <label>Selecione os Equipamentos</label>
                        <div class="epi-grid" id="listaEPIs"></div>
                    </div>
                    
                    <div class="form-group">
                        <label>Adicionar EPI Extra</label>
                        <div class="add-epi-container">
                            <input type="text" id="novoEpiNome" placeholder="Nome do EPI...">
                            <button type="button" id="btnAdicionarEpi" class="btn btn-outline">+ Add</button>
                        </div>
                    </div>

                    <div class="warning-box" id="warningBox"></div>
                    <button type="submit" class="btn btn-primary" id="btnGravar">✓ Confirmar Entrega</button>
                </form>
            </section>

            <!-- ABA 2: HISTÓRICO -->
            <section id="tab-historico" class="tab-content">
                <div class="form-group row-group">
                    <input type="number" id="filtroMatricula" placeholder="🔍 Matrícula...">
                    <select id="filtroEquipamento"></select>
                </div>

                <div class="table-responsive">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Colaborador</th>
                                <th>EPI</th>
                                <th>Último</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaHistorico"></tbody>
                    </table>
                </div>

                <div class="btn-group" style="margin-bottom: 20px;">
                    <button onclick="exportarPDF()" class="btn btn-pdf">📄 PDF</button>
                    <button onclick="enviarWhatsApp()" class="btn btn-wpp">🟢 WhatsApp</button>
                </div>
                
                <button id="limparHistorico" class="btn btn-outline" style="color: var(--danger); border-color: var(--border);">🗑️ Limpar Banco de Dados</button>
            </section>

            <!-- ABA 3: EQUIPA -->
            <section id="tab-colab" class="tab-content">
                <div class="form-group">
                    <label>Matrícula</label>
                    <input type="number" id="gerirMatricula" placeholder="Ex: 99999">
                </div>
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="gerirNome" placeholder="Ex: JOÃO DA SILVA">
                </div>
                <div class="form-group">
                    <label>Turma</label>
                    <input type="number" id="gerirTurma" placeholder="Ex: 8">
                </div>
                
                <div class="btn-group">
                    <button id="btnAdicionarColab" class="btn btn-primary">Guardar / Atualizar</button>
                    <button id="btnRemoverColab" class="btn btn-danger">Remover</button>
                </div>
            </section>
        </div>
    </div>

    <script>
        // --- 1. REGISTO DO SERVICE WORKER (PWA) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Offline ativo'))
                    .catch(err => console.log('PWA falhou', err));
            });
        }

        // --- 2. LÓGICA DE INSTALAÇÃO (PROMPT ANDROID/IOS) ---
        let deferredPrompt;
        const btnInstalar = document.getElementById('btnInstalarApp');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            btnInstalar.style.display = 'block'; // Mostra o botão no Android
        });

        btnInstalar.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') btnInstalar.style.display = 'none';
                    deferredPrompt = null;
                });
            } else {
                // Instruções para iOS (Safari)
                alert("🍎 Para instalar no iPhone (iOS):\n\n1. Toque no ícone de Partilha (Quadrado com seta para cima) no Safari.\n2. Escolha a opção 'Adicionar ao Ecrã Principal'.");
            }
        });

        // Força mostrar o botão no iOS para dar as instruções manuais
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS && !window.navigator.standalone) {
            btnInstalar.style.display = 'block';
        }

        // --- 3. INICIALIZAÇÃO DA INTERFACE ---
        window.addEventListener('load', function() {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.visibility = 'hidden', 500);
            }, 1200); 
            renderizarEPIs();
            renderizarFiltroEPIs();
        });

        function openTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
            if (tabId === 'tab-historico') atualizarTabela();
        }

        const mapaLideres = {
            "68592": { nome: "Marcos Antônio", turma: "8" },
            "66680": { nome: "Lázaro Edivânio", turma: "9" },
            "68999": { nome: "Diogo Berg", turma: "89" }
        };

        const baseInicialColaboradores = {
            "93482": { nome: "DIEGO MORAES SILVA", turma: "8" },
            "71562": { nome: "FRANCIVALDO DA MATA SANTOS", turma: "9" },
            "85640": { nome: "JOSIVALDO GONZAGA DA COSTA", turma: "89" },
            "95882": { nome: "DIEGO RAUL ANTUNES OLIVEIRA", turma: "8" }
        };

        const epiPadrao = [
            "Boné Brim Cinza", "Boné Azul", "Boné Rural", "Tela Facial", "Óculos Seg. Industr. Uvex Cinza",
            "Óculos Lente Transparente", "Luva Couro c/ Reforço Cano Longo", "Luva Vaqueta c/ Raspa Cano 20cm",
            "Luva Previlon", "Luva Nitrílica", "Luva PVC 36cm", "Capa de Chuva", "Protetor Concha",
            "Luva Vaqueta", "Short", "Camisa Jaleco", "Camisa Helanca", "Calça Helanca", "Luva Motoqueiro",
            "Kit Aplicação", "Máscara Descartável", "Respirador Semi-Facial Moldex", "Cartucho Vapor Orgânico Moldex",
            "Filtro Mecânico P2 Moldex", "Retentor Pré-Filtro Moldex", "Garrafa 5L", "Marmita", "Enxada",
            "Cabo de Enxada", "Porta Lima", "Lima", "Calça Brim Industrial Cinza Claro", "Camisa Brim Manga Longa Cinza Claro",
            "Calça Jeans Mod. Masculino", "Camisa Sempre Igual Azul", "Bota Couro Preta S/ Cadarço S/ Biqueira",
            "Bota Couro Preta S/ Cadarço C/ Biqueira", "Bota PVC"
        ];
        
        let episAdicionados = JSON.parse(localStorage.getItem('episAdicionadosAgrovale')) || [];
        let colaboradores = JSON.parse(localStorage.getItem('colaboradoresAgrovale')) || baseInicialColaboradores;
        let historicoEntregas = JSON.parse(localStorage.getItem('entregasEpiAgrovale')) || [];
        let entregasFiltradasAtuais = []; 

        if (!localStorage.getItem('colaboradoresAgrovale')) localStorage.setItem('colaboradoresAgrovale', JSON.stringify(colaboradores));

        function obterTodosEPIs() { return [...epiPadrao, ...episAdicionados]; }

        function renderizarEPIs() {
            const container = document.getElementById('listaEPIs');
            container.innerHTML = '';
            obter
